name: CI

on:
  # Push nur auf `main` (Nachlauf nach einem Merge: der Trunk ist immer grün, 90_Arbeitsweise §7).
  # Feature-Branches werden über ihren Pull Request geprüft — vorher gilt lokales `pnpm pruefe`.
  # Vorher stand hier `branches: ['**']`: jeder Push auf einen PR-Branch löste zwei vollständige
  # Läufe aus (push + pull_request), doppelte CI-Minuten und doppelte Wartezeit im Kettenlauf.
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Ein Lauf je Branch. Schiebt jemand zweimal kurz hintereinander auf denselben Pull Request,
# wird der ältere Lauf abgebrochen statt zu Ende bezahlt. Auf `main` wird **nicht** abgebrochen:
# der Nachlauf nach einem Merge ist der Beleg, dass der Trunk grün ist (90_Arbeitsweise §7) —
# ein abgebrochener Lauf wäre dort ein Loch in der Historie.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pruefen:
    name: pruefen (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: pnpm einrichten
        uses: pnpm/action-setup@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Abhängigkeiten installieren
        run: pnpm install --frozen-lockfile

      - name: Vergleichsbasis für Prüfpfad ermitteln
        # Bei pull_request ist base.sha bereits main-relativ. Der push-Zweig greift seit dem
        # Trigger-Umbau nur noch für `main` selbst (Nachlauf nach einem Merge, Diff dann leer);
        # er bleibt als Rückfall stehen. Bei push (auch über mehrere
        # Pushes hinweg gewachsene Branches) ist github.event.before nur der vorherige
        # Branch-Tip — das lässt frühere Pushes (z. B. eine Migrationsdatei) aus dem Diff
        # fallen und die Migrations-Ausnahme des Prüfpfad-Gates greift dann nicht. Deshalb
        # wird bei push gegen den Abzweigpunkt von origin/main verglichen (merge-base), der
        # die vollständige Branch-Divergenz abbildet.
        id: pruefpfad_basis
        shell: bash
        env:
          EREIGNIS: ${{ github.event_name }}
          PR_BASIS: ${{ github.event.pull_request.base.sha }}
          PUSH_VORHER: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EREIGNIS" = "pull_request" ]; then
            echo "basis=$PR_BASIS" >> "$GITHUB_OUTPUT"
          else
            git fetch --no-tags --quiet origin main:refs/remotes/origin/main || true
            merge_base=""
            if git rev-parse --verify --quiet origin/main >/dev/null; then
              merge_base=$(git merge-base origin/main HEAD || true)
            fi
            if [ -n "$merge_base" ]; then
              echo "basis=$merge_base" >> "$GITHUB_OUTPUT"
            else
              echo "::warning::merge-base gegen origin/main nicht ermittelbar — Rückfall auf github.event.before."
              echo "basis=$PUSH_VORHER" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Geschützten Prüfpfad prüfen
        shell: bash
        run: pnpm exec tsx skripte/pruefpfad-pruefen.ts
        env:
          PRUEFPFAD_BASE_SHA: ${{ steps.pruefpfad_basis.outputs.basis }}
          PRUEFPFAD_HEAD_SHA: ${{ github.sha }}

      - name: Typen
        run: pnpm typen

      - name: Lint
        run: pnpm lint

      - name: Grenzen
        run: pnpm grenzen

      - name: Graphviz einrichten
        if: runner.os == 'macOS'
        run: brew install graphviz

      - name: Abhängigkeitsgraph erzeugen
        if: runner.os == 'macOS'
        run: pnpm grenzen:graph

      - name: Abhängigkeitsgraph als Artefakt
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: abhaengigkeitsgraph
          path: artefakte/abhaengigkeiten.svg
          if-no-files-found: error
          retention-days: 5

      - name: Test
        # U-130-undo-bitgleich-laufzeit (PR A, nur Messung): derselbe `pnpm test` wie lokal, nur in
        # der CI zusätzlich mit JSON-Reporter, damit die Laufzeit je Testdatei je OS sichtbar wird.
        # `pnpm run test …` statt `pnpm test -- …`: pnpm 12 reicht nach `run <script>` jedes Token
        # unverändert durch; `pnpm test -- …` gäbe `--` an Vitest weiter, und Vitest ignorierte die
        # Reporter-Argumente dahinter stillschweigend (lokal geprüft). Lokal (`pnpm test`/`pnpm pruefe`)
        # ändert sich nichts — kein Reporter in vitest.config.ts.
        run: pnpm run test --reporter=default --reporter=json --outputFile.json=artefakte/vitest-laufzeiten.json

      - name: Testlaufzeiten als Artefakt
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: vitest-laufzeiten-${{ matrix.os }}
          path: artefakte/vitest-laufzeiten.json
          if-no-files-found: warn
          retention-days: 14

      - name: Testlaufzeiten auswerten
        # Kein Gate: schreibt die zehn langsamsten Testdateien ins Log und in die Job-Übersicht und
        # warnt, wenn `undo-bitgleich` die Beobachtungsgrenze von 120 s überschreitet (Timeout 180 s).
        # Endet immer mit 0 — die Messung darf den Lauf nicht rot machen (U-130-undo-bitgleich-laufzeit).
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          node <<'SKRIPT' || echo "::warning::Testlaufzeiten konnten nicht ausgewertet werden."
          const fs = require('node:fs')
          const path = require('node:path')
          const datei = 'artefakte/vitest-laufzeiten.json'
          if (!fs.existsSync(datei)) {
            console.log(`::warning::${datei} fehlt — keine Laufzeiten.`)
            process.exit(0)
          }
          const bericht = JSON.parse(fs.readFileSync(datei, 'utf8'))
          const zeilen = bericht.testResults
            .map((t) => ({
              datei: path.relative(process.cwd(), t.name).split(path.sep).join('/'),
              sekunden: (t.endTime - t.startTime) / 1000,
              status: t.status,
            }))
            .sort((a, b) => b.sekunden - a.sekunden)
          const top = zeilen.slice(0, 10)
          const os = process.env.RUNNER_OS ?? 'lokal'
          console.log(`Die zehn langsamsten Testdateien (${os}):`)
          for (const z of top) console.log(`${z.sekunden.toFixed(1).padStart(8)} s  ${z.datei}`)
          const md = [
            `### Langsamste Testdateien (${os})`,
            '',
            '| Datei | Dauer (s) | Status |',
            '|---|---:|---|',
            ...top.map((z) => `| \`${z.datei}\` | ${z.sekunden.toFixed(1)} | ${z.status} |`),
            '',
          ].join('\n')
          if (process.env.GITHUB_STEP_SUMMARY) fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md + '\n')
          const ziel = 'test/invarianten/undo-bitgleich.test.ts'
          const undo = zeilen.find((z) => z.datei === ziel)
          if (undo === undefined) console.log(`::warning::${ziel} nicht im Bericht gefunden.`)
          else if (undo.sekunden > 120)
            console.log(`::warning file=${ziel}::${ziel} lief ${undo.sekunden.toFixed(1)} s (> 120 s, Timeout 180 s) — U-130-undo-bitgleich-laufzeit`)
          SKRIPT

      - name: Bauen
        run: pnpm build

      - name: Paket als Artefakt
        uses: actions/upload-artifact@v4
        with:
          name: paket-${{ matrix.os }}
          path: dist/**
          if-no-files-found: error
          retention-days: 5

      - name: Screenshot Hauptfenster
        if: runner.os == 'Windows'
        run: node skripte/screenshot-hauptfenster.mjs artefakte/hauptfenster-windows.png

      - name: Screenshot als Artefakt
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-hauptfenster-windows
          path: artefakte/hauptfenster-windows.png
          if-no-files-found: error
          retention-days: 5

  langsame-gates:
    name: langsame Gates (test:e2e, test:budget)
    runs-on: macos-latest
    # AP-0.16: `test:e2e` baut selbst (`electron-vite build && playwright test`) — kein eigener
    # Build-Schritt hier, damit lokal und in der CI derselbe Weg läuft. `test:e2e`/`test:budget`
    # tragen kein `--pass-with-no-tests`/`--passWithNoTests` mehr: ein Lauf ohne gefundene Tests
    # ist rot. Der App-Start-Test in `ablauf-00-start.spec.ts` wirft, wenn er sich in der CI
    # überspringen müsste (out/main/index.js fehlt). Damit kann dieses Gate wirklich rot werden.
    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v4

      - name: pnpm einrichten
        uses: pnpm/action-setup@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Abhängigkeiten installieren
        run: pnpm install --frozen-lockfile

      - name: E2E-Tests
        run: pnpm test:e2e

      - name: Bildvergleich-Aufnahmen als Artefakt (bei Fehlschlag)
        # AP-1.25: bleibt trotz Größen-Pinning (`test/e2e/bildvergleich.spec.ts`) stehen — falls auf
        # dem CI-Runner noch Rasterungsdrift auftritt, liefert dieses Artefakt die tatsächlichen
        # CI-Aufnahmen, aus denen umgebungsechte Baselines geerntet werden können.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bildvergleich-aufnahmen
          path: test-results/**

      - name: Zustandsbibliothek-Bilder als Artefakt
        # AP-1.11 (72_Screens_und_Flows.md S-19): `test/e2e/zustandsbibliothek.spec.ts` schreibt die
        # vier Aufnahmen (hell/dunkel × Standarddichte/kompakt) nach `artefakte/bilder/` — hier als
        # eigenes Artefakt, damit ein Blick auch ohne lokalen `pnpm bilder`-Lauf möglich ist.
        uses: actions/upload-artifact@v4
        with:
          name: zustandsbibliothek-bilder
          path: artefakte/bilder/**
          if-no-files-found: error
          retention-days: 5

      - name: Leistungsbudgets
        run: pnpm test:budget
