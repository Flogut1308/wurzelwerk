name: CI

on:
  # Push nur auf `main` (Nachlauf nach einem Merge: der Trunk ist immer grün, 90_Arbeitsweise §7).
  # Feature-Branches werden über ihren Pull Request geprüft — vorher gilt lokales `pnpm pruefe`.
  # Vorher stand hier `branches: ['**']`: jeder Push auf einen PR-Branch löste zwei vollständige
  # Läufe aus (push + pull_request), doppelte CI-Minuten und doppelte Wartezeit im Kettenlauf.
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Ein Lauf je Branch. Schiebt jemand zweimal kurz hintereinander auf denselben Pull Request,
# wird der ältere Lauf abgebrochen statt zu Ende bezahlt. Auf `main` wird **nicht** abgebrochen:
# der Nachlauf nach einem Merge ist der Beleg, dass der Trunk grün ist (90_Arbeitsweise §7) —
# ein abgebrochener Lauf wäre dort ein Loch in der Historie.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pruefen:
    name: pruefen (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: pnpm einrichten
        uses: pnpm/action-setup@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Abhängigkeiten installieren
        run: pnpm install --frozen-lockfile

      - name: Vergleichsbasis für Prüfpfad ermitteln
        # Bei pull_request ist base.sha bereits main-relativ. Der push-Zweig greift seit dem
        # Trigger-Umbau nur noch für `main` selbst (Nachlauf nach einem Merge, Diff dann leer);
        # er bleibt als Rückfall stehen. Bei push (auch über mehrere
        # Pushes hinweg gewachsene Branches) ist github.event.before nur der vorherige
        # Branch-Tip — das lässt frühere Pushes (z. B. eine Migrationsdatei) aus dem Diff
        # fallen und die Migrations-Ausnahme des Prüfpfad-Gates greift dann nicht. Deshalb
        # wird bei push gegen den Abzweigpunkt von origin/main verglichen (merge-base), der
        # die vollständige Branch-Divergenz abbildet.
        id: pruefpfad_basis
        shell: bash
        env:
          EREIGNIS: ${{ github.event_name }}
          PR_BASIS: ${{ github.event.pull_request.base.sha }}
          PUSH_VORHER: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EREIGNIS" = "pull_request" ]; then
            echo "basis=$PR_BASIS" >> "$GITHUB_OUTPUT"
          else
            git fetch --no-tags --quiet origin main:refs/remotes/origin/main || true
            merge_base=""
            if git rev-parse --verify --quiet origin/main >/dev/null; then
              merge_base=$(git merge-base origin/main HEAD || true)
            fi
            if [ -n "$merge_base" ]; then
              echo "basis=$merge_base" >> "$GITHUB_OUTPUT"
            else
              echo "::warning::merge-base gegen origin/main nicht ermittelbar — Rückfall auf github.event.before."
              echo "basis=$PUSH_VORHER" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Geschützten Prüfpfad prüfen
        shell: bash
        run: pnpm exec tsx skripte/pruefpfad-pruefen.ts
        env:
          PRUEFPFAD_BASE_SHA: ${{ steps.pruefpfad_basis.outputs.basis }}
          PRUEFPFAD_HEAD_SHA: ${{ github.sha }}

      - name: Typen
        run: pnpm typen

      - name: Lint
        run: pnpm lint

      - name: Grenzen
        run: pnpm grenzen

      - name: Graphviz einrichten
        if: runner.os == 'macOS'
        run: brew install graphviz

      - name: Abhängigkeitsgraph erzeugen
        if: runner.os == 'macOS'
        run: pnpm grenzen:graph

      - name: Abhängigkeitsgraph als Artefakt
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: abhaengigkeitsgraph
          path: artefakte/abhaengigkeiten.svg
          if-no-files-found: error
          retention-days: 5

      - name: Test
        run: pnpm test

      - name: Bauen
        run: pnpm build

      - name: Paket als Artefakt
        uses: actions/upload-artifact@v4
        with:
          name: paket-${{ matrix.os }}
          path: dist/**
          if-no-files-found: error
          retention-days: 5

      - name: Screenshot Hauptfenster
        if: runner.os == 'Windows'
        run: node skripte/screenshot-hauptfenster.mjs artefakte/hauptfenster-windows.png

      - name: Screenshot als Artefakt
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-hauptfenster-windows
          path: artefakte/hauptfenster-windows.png
          if-no-files-found: error
          retention-days: 5

  langsame-gates:
    name: langsame Gates (test:e2e, test:budget)
    runs-on: macos-latest
    # AP-0.16: `test:e2e` baut selbst (`electron-vite build && playwright test`) — kein eigener
    # Build-Schritt hier, damit lokal und in der CI derselbe Weg läuft. `test:e2e`/`test:budget`
    # tragen kein `--pass-with-no-tests`/`--passWithNoTests` mehr: ein Lauf ohne gefundene Tests
    # ist rot. Der App-Start-Test in `ablauf-00-start.spec.ts` wirft, wenn er sich in der CI
    # überspringen müsste (out/main/index.js fehlt). Damit kann dieses Gate wirklich rot werden.
    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v4

      - name: pnpm einrichten
        uses: pnpm/action-setup@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Abhängigkeiten installieren
        run: pnpm install --frozen-lockfile

      - name: E2E-Tests
        run: pnpm test:e2e

      - name: Zustandsbibliothek-Bilder als Artefakt
        # AP-1.11 (72_Screens_und_Flows.md S-19): `test/e2e/zustandsbibliothek.spec.ts` schreibt die
        # vier Aufnahmen (hell/dunkel × Standarddichte/kompakt) nach `artefakte/bilder/` — hier als
        # eigenes Artefakt, damit ein Blick auch ohne lokalen `pnpm bilder`-Lauf möglich ist.
        uses: actions/upload-artifact@v4
        with:
          name: zustandsbibliothek-bilder
          path: artefakte/bilder/**
          if-no-files-found: error
          retention-days: 5

      - name: Leistungsbudgets
        run: pnpm test:budget
