appId: dev.gutnoff.wurzelwerk
productName: Wurzelwerk
directories:
  output: dist

files:
  - out/**/*
  - package.json

asarUnpack:
  - '**/*.node'

mac:
  target:
    - target: dir
      arch:
        - arm64
        - x64
  category: public.app-category.productivity

win:
  target:
    - target: dir
      arch:
        - x64
